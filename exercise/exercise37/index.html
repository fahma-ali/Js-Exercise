<!doctype html>
<html>
  <head>
    <title>exercise 37</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Simple Blog</h1>

    <div class="blog-container">
      <h2>Create a New Post</h2>

      <form class="blog-form">
        <div class="blog-post">
          <input type="text" name="post-title" class="post-title" placeholder="Post Title">
          <input type="text" class="image" placeholder="Image URL">
          <textarea name="post-body" class="post-body" rows="10" placeholder="Write your post here"></textarea>
          <button type="submit">Add Post</button>
        </div>
      </form>
    </div>

    <div class="container-result">
      <h2>All Posts</h2>

      <div class="post-result">
       
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
