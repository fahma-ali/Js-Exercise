<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>YouTube Video Search App</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts (Optional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="logo.svg" alt="Logo" />
        <h1>YouTube Search</h1>
      </div>
      <form id="search-form">
        <input type="text" id="search-input" placeholder="Search" />
        <button type="submit" id="btn-search">Search</button>
      </form>
    </header>

    <div id="video-list"></div>
    <div class="model" id="video-model">
      <div class="model-content">
        <span class="close-model">&times;</span>
        <iframe
          id="video-player"
          src="https://www.youtube.com/embed/FLCVd8tJA2U?si=HGXdrJak70giOKYW"
          title="YouTube video player"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>

        <button id="download-mp3">download-mp3</button>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
